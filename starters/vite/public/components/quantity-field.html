<style>
    :host {
        display: block;
        margin-block: 1rem;
    }

    .field {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        align-items: center;
        gap: 0.6rem;
        padding: 0.8rem;
        border: 1px solid #cad6e5;
        border-radius: 0.75rem;
        background: #f7f9fc;
    }

    button {
        width: 2.5rem;
        height: 2.5rem;
        border: 1px solid #9fb0c5;
        border-radius: 50%;
        color: #17366f;
        background: #fff;
        cursor: pointer;
    }

    output {
        min-width: 2ch;
        text-align: center;
        font-weight: 800;
    }
</style>

<div class="field" x-data>
    <span id="quantity-label">Quantity</span>
    <button
        type="button"
        aria-label="Decrease quantity"
        :disabled="$props.disabledState"
        @click="$props.quantity = Math.max(0, $props.quantity - 1); $props.$emit('quantity-change', { value: $props.quantity })"
    >
        −
    </button>
    <output aria-labelledby="quantity-label" x-text="$props.quantity"></output>
    <button
        type="button"
        aria-label="Increase quantity"
        :disabled="$props.disabledState"
        @click="$props.quantity += 1; $props.$emit('quantity-change', { value: $props.quantity })"
    >
        +
    </button>
</div>
