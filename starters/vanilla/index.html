<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>ACL vanilla starter</title>
        <script type="importmap">
            {
                "imports": {
                    "alpinejs": "https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/module.esm.min.js",
                    "alpine-component-loader": "https://cdn.jsdelivr.net/gh/LouisT/alpine-component-loader/dist/index.min.js",
                    "alpine-component-loader/core": "https://cdn.jsdelivr.net/gh/LouisT/alpine-component-loader/dist/core.min.js",
                    "alpine-component-loader/polyfills": "https://cdn.jsdelivr.net/gh/LouisT/alpine-component-loader/dist/polyfills.min.js",
                    "alpine-component-loader/auto": "https://cdn.jsdelivr.net/gh/LouisT/alpine-component-loader/dist/auto.min.js",
                    "alpine-component-loader/dev": "https://cdn.jsdelivr.net/gh/LouisT/alpine-component-loader/dist/dev.min.js",
                    "alpine-component-loader/debugger": "https://cdn.jsdelivr.net/gh/LouisT/alpine-component-loader/dist/debugger.min.js",
                    "alpine-component-loader/a11y": "https://cdn.jsdelivr.net/gh/LouisT/alpine-component-loader/dist/a11y.min.js",
                    "alpine-component-loader/a11y-scanner": "https://cdn.jsdelivr.net/gh/LouisT/alpine-component-loader/dist/a11y-scanner.min.js",
                    "alpine-component-loader/offline": "https://cdn.jsdelivr.net/gh/LouisT/alpine-component-loader/dist/offline.min.js",
                    "alpine-component-loader/observability-exporters": "https://cdn.jsdelivr.net/gh/LouisT/alpine-component-loader/dist/observability-exporters.min.js",
                    "alpine-component-loader/testing": "https://cdn.jsdelivr.net/gh/LouisT/alpine-component-loader/dist/testing.min.js"
                }
            }
        </script>
        <script type="module" src="./app.js"></script>
    </head>

    <body>
        <nav aria-label="Startup examples">
            <a href="./">Default discovery</a>
            <a href="?entry=core">Explicit core startup</a>
            <a href="?polyfills=1">Optional polyfills</a>
            <a href="?entry=core&amp;polyfills=1">Core with optional polyfills</a>
        </nav>
        <p id="startup-status" role="status">Preparing application registration</p>
        <button id="retry-startup" type="button" hidden>Reload to retry startup</button
        ><acl-boundary>
            <hello-card name="World">Loaded from a URL-relative manifest.</hello-card>
            <p slot="fallback" role="alert">The greeting could not be loaded.</p>
        </acl-boundary>
    </body>
</html>
