name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:format:js
      - run: npm run check:javascript-style
      - run: npm run build
      - run: npm run playwright:install:ci -- chromium
      - run: npm run test:unit
      - run: npm run test:types
      - run: npm run test:implementation-types
      - run: npm run check:size
      - run: npm run security:static
      - run: npm run check:docs
      - run: npm run check:package
      - run: node scripts/check-lean-install.mjs
      - run: npm run check:reproducible
      - run: git diff --check
      - name: Upload built distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist

  browser-pr:
    name: Browser PR coverage (${{ matrix.browser }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run playwright:install:ci -- ${{ matrix.browser }}
      - run: npx --no-install playwright test tests/loader-registration.spec.js tests/loader-rendering-diagnostics.spec.js tests/modernization.spec.js tests/runtime-module-loading.spec.js --project=${{ matrix.browser }}

  coverage:
    name: Main coverage and Chromium
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run playwright:install:ci -- chromium
      - run: npm run test:coverage

  node-compatibility:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run playwright:install:ci -- chromium
      - run: npm run test:unit
      - run: npm run test:types

  browsers:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run playwright:install:ci -- ${{ matrix.browser }}
      - run: npx --no-install playwright test --project=${{ matrix.browser }}
