name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Explain local CodeQL results
        if: vars.ACL_CODEQL_UPLOAD_ENABLED != 'true'
        run: echo "CodeQL results will be retained as an artifact. Set ACL_CODEQL_UPLOAD_ENABLED=true after enabling GitHub Advanced Security."
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4.37.6
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4.37.6
        with:
          output: codeql-results
          upload: ${{ vars.ACL_CODEQL_UPLOAD_ENABLED == 'true' && 'always' || 'never' }}
      - name: Retain local CodeQL results
        if: vars.ACL_CODEQL_UPLOAD_ENABLED != 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: codeql-results
          path: codeql-results/*.sarif
