<style>
    :host {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: white;
        border: 1px solid #ddd;
        width: 42px;
        height: 42px;
        border-radius: 8px;
        font-weight: 800;
        color: #1d4ed8;
    }

    i {
        font-size: 20px;
        line-height: 1;
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }
</style>
<div :title="$props.label || 'Icon'">
    <i :class="$props.icon" aria-hidden="true"></i>
    <span class="sr-only" x-text="$props.label || 'Icon'"></span>
</div>
