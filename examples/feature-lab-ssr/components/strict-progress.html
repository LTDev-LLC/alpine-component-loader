<style>
    :host {
        display: block;
        padding: 1rem;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #fff;
    }

    .bar-bg {
        height: 20px;
        overflow: hidden;
        border-radius: 10px;
        background: #e5e7eb;
    }

    .bar-fill {
        height: 100%;
        background: #1d4ed8;
        transition: width 0.3s;
    }

    output {
        display: block;
        margin-top: 4px;
        color: #4b5563;
        font: 0.8rem system-ui, sans-serif;
        text-align: right;
    }
</style>
<div x-data="ssrStrictProgress">
    <div class="bar-bg">
        <div class="bar-fill" :style="progressStyle"></div>
    </div>
    <output x-text="progressLabel">75%</output>
</div>
