<style>
    :host {
        display: block;
    }

    article {
        height: 100%;
        padding: 1rem;
        border: 1px solid #a7f3d0;
        border-radius: 9px;
        background: #ecfdf5;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
    }

    p {
        min-height: 2.7rem;
        color: #166534;
    }

    .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
    }

    button {
        min-height: 2.5rem;
        padding: 0.55rem 0.8rem;
        border: 1px solid #047857;
        border-radius: 0.5rem;
        color: white;
        background: #047857;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
    }

    button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
    }
</style>
<article x-data="ssrPolling">
    <strong>Polling request <span x-text="count">0</span></strong>
    <p x-text="message">Server fallback · polling starts after hydration</p>
    <div class="actions">
        <button type="button" :disabled="paused" @click="pause">Pause</button>
        <button type="button" :disabled="resumed" @click="resume">Resume</button>
    </div>
</article>
