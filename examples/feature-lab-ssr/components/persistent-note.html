<style>
    :host {
        display: block;
    }

    article {
        padding: 1rem;
        border: 1px solid #d9e0ea;
        border-radius: 8px;
        background: #fff;
        font-family: system-ui, sans-serif;
    }

    h3 {
        margin: 0;
    }

    input {
        width: 100%;
        min-height: 2.5rem;
        margin: 0.75rem 0;
        padding: 0.55rem 0.7rem;
        border: 1px solid #94a3b8;
        border-radius: 0.5rem;
        box-sizing: border-box;
        font: inherit;
    }

    .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
    }

    button {
        min-height: 2.5rem;
        padding: 0.55rem 0.8rem;
        border: 1px solid #1d4ed8;
        border-radius: 0.5rem;
        color: white;
        background: #2563eb;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
    }

    output {
        display: block;
        min-height: 1.5em;
        margin-top: 0.5rem;
        color: #475569;
        font-size: 0.9rem;
    }
</style>
<article x-data="ssrPersistentNote">
    <h3><span x-text="$props.storage">localStorage</span> note</h3>
    <input x-model="$props.note" aria-label="Persistent note">
    <div class="actions">
        <button type="button" @click="increment">Count <span x-text="$props.count">0</span></button>
        <button type="button" @click="flush">Flush now</button>
        <button type="button" @click="clear">Clear stored record</button>
    </div>
    <output aria-live="polite" x-text="status">Changes save automatically after hydration</output>
</article>
